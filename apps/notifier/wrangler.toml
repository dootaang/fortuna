# 포르투나 디스코드 알림 중계 + 환전가 시세 기록원 Worker.
# 웹훅 주소는 비밀값으로만 등록한다:  corepack pnpm --filter @fortuna/notifier exec wrangler secret put DISCORD_WEBHOOK_URL
# 시세 기록원 계정과 시세 비밀값은 node scripts/create-oracle.mjs 가 만들어 비밀값으로 등록한다
# (ORACLE_REFRESH_TOKEN, MARKET_SECRET). 그다음 딜러 화면 › 거래소에서 기록원 UID를 등록한다.
name = "fortuna-notifier"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 1분마다 깨어나 그 1분 동안의 시세 틱(기본 15초 간격)을 찍는다.
[triggers]
crons = ["* * * * *"]

[vars]
FIREBASE_PROJECT_ID = "fortuna-472e3"
# 웹 앱에 공개되어 있는 Firebase 웹 API 키 (비밀 아님).
FIREBASE_API_KEY = "AIzaSyBj01v9rEnfq-R4ADS5D_2z-BWStcU5aY4"
# 쉼표로 구분. 앱이 배포된 주소만 허용한다.
ALLOWED_ORIGINS = "https://fortuna-472e3.web.app,https://fortuna-472e3.firebaseapp.com,http://127.0.0.1:5173,http://localhost:5173"
