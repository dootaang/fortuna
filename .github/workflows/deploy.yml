name: deploy

# Firebase(Hosting + Firestore rules/indexes) 배포. 지금은 Actions 탭에서 수동 실행만 한다.
# 서비스 계정(secrets.FIREBASE_SERVICE_ACCOUNT)에 "Firebase 관리자"와 "서비스 사용량 소비자" 역할을 준 뒤,
# 아래 workflow_run 블록의 주석을 풀면 main에서 verify가 통과할 때마다 자동 배포된다.
on:
  # workflow_run:
  #   workflows: [verify]
  #   types: [completed]
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: pnpm exec firebase deploy --only hosting,firestore --project fortuna-472e3 --non-interactive
